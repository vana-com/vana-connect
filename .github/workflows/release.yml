name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "connect/**"
      - "examples/**"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # Phase 1: Determine next version via dry-run.
  # If no release is needed, all downstream jobs are skipped.
  resolve-version:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      new-release-version: ${{ steps.version.outputs.new-release-version }}
      new-release-published: ${{ steps.version.outputs.new-release-published }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Determine next version
        id: version
        run: |
          # Temporarily swap in a minimal releaserc that only runs the
          # commit analyzer — avoids npm token verification failures
          # that abort the dry-run before the version is determined.
          cp .releaserc.yaml .releaserc.yaml.bak
          cat > .releaserc.yaml <<'EOF'
          branches: ["main"]
          plugins:
            - - "@semantic-release/commit-analyzer"
              - preset: conventionalcommits
                releaseRules:
                  - breaking: true
                    release: minor
          EOF
          pnpm exec semantic-release --dry-run 2>&1 | tee /tmp/sr-output.txt || true
          mv .releaserc.yaml.bak .releaserc.yaml
          VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' /tmp/sr-output.txt || true)
          if [ -n "$VERSION" ]; then
            echo "new-release-version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "new-release-published=true" >> "$GITHUB_OUTPUT"
            echo "Next release: $VERSION"
          else
            echo "new-release-published=false" >> "$GITHUB_OUTPUT"
            echo "No release needed"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Phase 2: Build SEA binaries with the correct version baked in.
  build-sea:
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-14
            platform: darwin
            arch: arm64
            archive_format: tar.gz
            binary_name: vana
          - runner: windows-2022
            platform: win32
            arch: x64
            archive_format: zip
            binary_name: vana.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Inject the resolved version into package.json before building
      - name: Set release version
        run: npm version ${{ needs.resolve-version.outputs.new-release-version }} --no-git-tag-version --allow-same-version
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm build:sea -- --artifact-name vana-${{ matrix.platform }}-${{ matrix.arch }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --archive-format ${{ matrix.archive_format }} --binary-name ${{ matrix.binary_name }}
      - run: pnpm sea:check -- --artifact-dir artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }} --archive artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }} --checksum artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256 --platform ${{ matrix.platform }} --binary-name ${{ matrix.binary_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: vana-sea-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256

  # Phase 2 (parallel): Build demo assets
  demo-preview:
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm build:sea -- --artifact-name vana-linux-x64 --platform linux --arch x64 --archive-format tar.gz --binary-name vana
      - run: pnpm demo:transcripts
      - run: pnpm demo:vhs
      - uses: actions/upload-artifact@v7
        with:
          name: vana-demo-preview
          path: |
            docs/transcripts
            docs/vhs

  # Phase 3: Run semantic-release for real (npm publish, git tag, GitHub release).
  release:
    needs: [resolve-version, build-sea, demo-preview]
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm pack:check
      - uses: actions/download-artifact@v8
        with:
          pattern: vana-sea-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: vana-demo-preview
          path: artifacts/demo-preview
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Generate package-manager metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RELEASE_TAG=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          pnpm package-managers:generate -- --release-tag "$RELEASE_TAG" --package-version "$PACKAGE_VERSION"
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RELEASE_TAG=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)
          mapfile -t RELEASE_FILES < <(node ./scripts/collect-release-assets.mjs)
          gh release upload "$RELEASE_TAG" "${RELEASE_FILES[@]}" --clobber

  verify-release-install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test latest published installer
        run: sh ./scripts/test-install-github-release.sh
      - name: Verify latest release demo assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)
          node ./scripts/assert-release-demo-assets.mjs --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

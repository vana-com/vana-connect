name: Canary Release

on:
  push:
    branches:
      - develop
      - "feat/**"
    paths-ignore:
      - "connect/**"
      - "examples/**"

permissions:
  contents: write

jobs:
  build-sea:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-14
            platform: darwin
            arch: arm64
            archive_format: tar.gz
            binary_name: vana
          - runner: windows-2022
            platform: win32
            arch: x64
            archive_format: zip
            binary_name: vana.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm build:sea -- --artifact-name vana-${{ matrix.platform }}-${{ matrix.arch }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --archive-format ${{ matrix.archive_format }} --binary-name ${{ matrix.binary_name }}
      - run: pnpm sea:check -- --artifact-dir artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }} --archive artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }} --checksum artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256 --platform ${{ matrix.platform }} --binary-name ${{ matrix.binary_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: vana-sea-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256
  canary:
    needs: build-sea
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm pack:check
      - name: Publish canary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          npm version "${VERSION}-canary.${SHORT_SHA}" --no-git-tag-version
          npm publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: vana-sea-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish branch prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_SLUG=$(printf "%s" "$GITHUB_REF_NAME" | tr '/_' '-' | tr -cd '[:alnum:]-')
          TAG="canary-${BRANCH_SLUG}"
          TITLE="Canary ${GITHUB_REF_NAME}"
          NOTES="Branch canary for ${GITHUB_REF_NAME} at ${SHORT_SHA}. Install with the branch installer and \`--version ${TAG}\`."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
            gh release upload "$TAG" artifacts/release/* --clobber
          else
            gh release create "$TAG" artifacts/release/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

name: Canary Release

on:
  push:
    branches:
      - develop
      - "feat/**"
    paths-ignore:
      - "connect/**"
      - "examples/**"

permissions:
  contents: read

jobs:
  build-sea:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-13
            platform: darwin
            arch: x64
            archive_format: tar.gz
            binary_name: vana
          - runner: macos-14
            platform: darwin
            arch: arm64
            archive_format: tar.gz
            binary_name: vana
          - runner: windows-2022
            platform: win32
            arch: x64
            archive_format: zip
            binary_name: vana.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:sea -- --artifact-name vana-${{ matrix.platform }}-${{ matrix.arch }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --archive-format ${{ matrix.archive_format }} --binary-name ${{ matrix.binary_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: vana-sea-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}
            artifacts/sea/vana-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_format }}.sha256
  canary:
    needs: build-sea
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Publish canary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          npm version "${VERSION}-canary.${SHORT_SHA}" --no-git-tag-version
          npm publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

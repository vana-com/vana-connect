name: Sync DataConnect Download Version

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-dataconnect-download-version
  cancel-in-progress: true

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve latest DataConnect release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh api repos/vana-com/data-connect/releases/latest --jq .tag_name)"
          if [ -z "$latest_tag" ]; then
            echo "Failed to resolve latest tag"
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Update DOWNLOAD_VERSION in config
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["LATEST_TAG"].removeprefix("v")
          path = Path("connect/src/config/config.ts")
          text = path.read_text()
          updated, count = re.subn(
              r'const DOWNLOAD_VERSION = "[^"]+";',
              f'const DOWNLOAD_VERSION = "{version}";',
              text,
              count=1,
          )
          if count != 1:
              print(
                  f"Failed to update DOWNLOAD_VERSION in {path}: expected 1 replacement, got {count}"
              )
              sys.exit(1)
          path.write_text(updated)
          PY

      - name: Create pull request when version changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/sync-dataconnect-download-version
          delete-branch: true
          commit-message: "ci(connect): sync DataConnect download version"
          title: "ci(connect): sync DataConnect download version"
          body: |
            ## Summary
            - sync `DOWNLOAD_VERSION` in `connect/src/config/config.ts` to the latest `vana-com/data-connect` release tag
            - keep `/download-data-connect` asset links current without manual edits

            ## Test plan
            - [ ] Run this workflow via workflow_dispatch
            - [ ] Confirm PR is created only when latest tag differs
            - [ ] Verify generated URLs on `/download-data-connect` point to the new release

branches: ["main"]
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: minor
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
  - - "@semantic-release/npm"
    - npmPublish: true
  - - "@semantic-release/git"
    - assets:
        - package.json
        - package-lock.json
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
  - - "@semantic-release/github"
    - assets:
        - path: artifacts/sea/vana-linux-x64.tar.gz
          label: vana-linux-x64.tar.gz
        - path: artifacts/sea/vana-linux-x64.tar.gz.sha256
          label: vana-linux-x64.tar.gz.sha256
